services:
  postgres:
    image: postgres:16.6-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { memory: 256M }

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?required}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:?required}
      APP_STORAGE_LOCAL_ROOT: /var/lib/jsboy/proofs
      APP_NOTIFICATIONS_PROVIDER: ${APP_NOTIFICATIONS_PROVIDER:?required}
      APP_PASSWORD_RESET_PROVIDER: ${APP_PASSWORD_RESET_PROVIDER:?required}
      APP_PROOF_OTP_PROVIDER: disabled
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:?required}
      RESEND_FROM: ${RESEND_FROM:?required}
    secrets:
      - source: postgres_password
        target: SPRING_DATASOURCE_PASSWORD
      - source: jwt_secret
        target: JWT_SECRET
      - source: resend_api_key
        target: RESEND_API_KEY
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    volumes:
      - ${PROOF_STORAGE_PATH:?required}:/var/lib/jsboy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    expose: ["8080", "9090"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { memory: 256M }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?required}
        VITE_BUSINESS_PHONE: ${VITE_BUSINESS_PHONE:-}
        VITE_BUSINESS_WHATSAPP: ${VITE_BUSINESS_WHATSAPP:-}
        VITE_BUSINESS_EMAIL: ${VITE_BUSINESS_EMAIL:-}
        VITE_BUSINESS_CITY: ${VITE_BUSINESS_CITY:-}
        VITE_BUSINESS_INSTAGRAM: ${VITE_BUSINESS_INSTAGRAM:-}
        VITE_BUSINESS_HOURS: ${VITE_BUSINESS_HOURS:-}
    restart: always
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m", "/var/cache/nginx:rw,noexec,nosuid,size=32m", "/var/run:rw,noexec,nosuid,size=8m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    expose: ["8080"]
    depends_on:
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
        reservations: { memory: 32M }

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?required}
  jwt_secret:
    file: ${JWT_SECRET_FILE:?required}
  resend_api_key:
    file: ${RESEND_API_KEY_FILE:?required}

volumes:
  postgres_data:

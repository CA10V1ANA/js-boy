spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  servlet:
    multipart:
      max-file-size: ${APP_STORAGE_MAX_FILE_BYTES:5242880}
      max-request-size: ${APP_STORAGE_MAX_REQUEST_BYTES:6291456}

server:
  forward-headers-strategy: native

app:
  bootstrap:
    owner:
      enabled: ${APP_BOOTSTRAP_OWNER_ENABLED:false}
  seed:
    owner-email: ${SEED_OWNER_EMAIL:}
    owner-password: ${SEED_OWNER_PASSWORD:}
  security:
    jwt-secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    require-https: ${APP_SECURITY_REQUIRE_HTTPS:true}
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
    local-root: ${APP_STORAGE_LOCAL_ROOT:/var/lib/jsboy/proofs}
    max-file-bytes: ${APP_STORAGE_MAX_FILE_BYTES:5242880}
  proof:
    otp:
      provider: ${APP_PROOF_OTP_PROVIDER:local}
      webhook-url: ${PROOF_OTP_WEBHOOK_URL:}
      webhook-token: ${PROOF_OTP_WEBHOOK_TOKEN:}
  notifications:
    provider: ${APP_NOTIFICATIONS_PROVIDER:local}
  password-reset:
    provider: ${APP_PASSWORD_RESET_PROVIDER:local}

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

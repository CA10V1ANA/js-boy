spring:
  application:
    name: js-boy-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: none
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  chat:
    post-completion-hours: ${CHAT_POST_COMPLETION_HOURS:48}
    max-chars: ${CHAT_MAX_CHARS:2000}
    sends-per-minute: ${CHAT_SENDS_PER_MINUTE:20}
  mercadopago:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    swagger-enabled: false
    h2-console-enabled: false
    require-https: false

logging:
  level:
    root: INFO
    com.ravtec.delivery: INFO
    org.hibernate.SQL: WARN

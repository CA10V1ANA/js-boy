spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        format_sql: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: ${APP_STORAGE_MAX_FILE_BYTES:5242880}
      max-request-size: ${APP_STORAGE_MAX_REQUEST_BYTES:6291456}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:30}
    login:
      source-max-requests: ${LOGIN_SOURCE_MAX_REQUESTS:30}
      global-max-requests: ${LOGIN_GLOBAL_MAX_REQUESTS:1000}
      window-minutes: ${LOGIN_WINDOW_MINUTES:5}
      counter-ttl-hours: ${LOGIN_COUNTER_TTL_HOURS:24}
    password-reset:
      source-max-requests: ${PASSWORD_RESET_SOURCE_MAX_REQUESTS:5}
      global-max-requests: ${PASSWORD_RESET_GLOBAL_MAX_REQUESTS:300}
      window-minutes: ${PASSWORD_RESET_WINDOW_MINUTES:60}
      account-cooldown-seconds: ${PASSWORD_RESET_ACCOUNT_COOLDOWN_SECONDS:60}
    public-rate-limit:
      max-keys: ${PUBLIC_RATE_LIMIT_MAX_KEYS:10000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    swagger-enabled: false
    h2-console-enabled: false
    require-https: true
  storage:
    provider: ${APP_STORAGE_PROVIDER}
    local-root: ${APP_STORAGE_LOCAL_ROOT:/var/lib/jsboy/proofs}
    max-file-bytes: ${APP_STORAGE_MAX_FILE_BYTES:5242880}
  proof:
    max-count-per-delivery: ${PROOF_MAX_COUNT_PER_DELIVERY:10}
    max-bytes-per-delivery: ${PROOF_MAX_BYTES_PER_DELIVERY:26214400}
    max-bytes-per-driver: ${PROOF_MAX_BYTES_PER_DRIVER:1073741824}
    max-total-bytes: ${PROOF_MAX_TOTAL_BYTES:10737418240}
    image:
      max-width: ${PROOF_IMAGE_MAX_WIDTH:4096}
      max-height: ${PROOF_IMAGE_MAX_HEIGHT:4096}
      max-pixels: ${PROOF_IMAGE_MAX_PIXELS:12000000}
      max-expansion-ratio: ${PROOF_IMAGE_MAX_EXPANSION_RATIO:250}
    otp:
      provider: ${APP_PROOF_OTP_PROVIDER}
      webhook-url: ${PROOF_OTP_WEBHOOK_URL}
      expiration-minutes: ${PROOF_OTP_EXPIRATION_MINUTES:10}
      resend-seconds: ${PROOF_OTP_RESEND_SECONDS:60}
      max-attempts: ${PROOF_OTP_MAX_ATTEMPTS:5}
  tracking:
    rate-limit:
      max-requests: ${TRACKING_SOURCE_MAX_REQUESTS:30}
      global-max-requests: ${TRACKING_GLOBAL_MAX_REQUESTS:3000}
      window-minutes: ${TRACKING_RATE_LIMIT_WINDOW_MINUTES:5}
  customers:
    driver-daily-create-limit: ${DRIVER_CUSTOMER_DAILY_CREATE_LIMIT:20}
  notifications:
    provider: ${APP_NOTIFICATIONS_PROVIDER}
    poll-ms: ${APP_NOTIFICATIONS_POLL_MS:30000}
  password-reset:
    provider: ${APP_PASSWORD_RESET_PROVIDER}
  frontend-url: ${PUBLIC_FRONTEND_URL}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_FROM:}
    whatsapp: ${TWILIO_WHATSAPP:true}
    content-sid: ${TWILIO_CONTENT_SID:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:}
  business-zone: ${BUSINESS_TIME_ZONE:America/Fortaleza}

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.ravtec.delivery: INFO
    org.hibernate.SQL: WARN

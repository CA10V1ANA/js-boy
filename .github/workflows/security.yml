name: Security gates

on:
  pull_request:
  push:
    branches: [main, develop, "codex/**", "feat/**", "fix/**"]

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detectar segredos
        uses: gitleaks/gitleaks-action@v2

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Auditar dependências Java
        working-directory: backend
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Auditar dependências web
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analisar código, imagens declaradas e configurações
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  migrations:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Aplicar todas as migrations e validar o ORM
        run: mvn -B -ntp -Dtest=MigrationLocalTest test

  images:
    needs: [secrets, dependencies, filesystem, migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build reproduzível sem publicação
        run: |
          docker build --pull --tag jsboy-api:ci backend
          docker build --pull --build-arg VITE_API_URL=https://api.example.invalid --tag jsboy-web:ci frontend
      - name: Exportar metadados de imagem
        run: docker image inspect jsboy-api:ci jsboy-web:ci > image-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: image-metadata.json
          retention-days: 14

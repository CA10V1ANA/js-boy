name: Security gates

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, develop, "codex/**", "feat/**", "fix/**"]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detectar segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Java é auditado pelo Trivy no job filesystem, incluindo dependências transitivas.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Auditar dependências web
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  filesystem:
    needs: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java e restaurar dependências Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Preparar dependências Java para a análise
        working-directory: backend
        run: mvn -B -ntp -DskipTests dependency:resolve
      - name: Analisar código, imagens declaradas e configurações
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validar migrations, ORM e condições das exceções de segurança
        run: mvn -B -ntp -Dtest=MigrationLocalTest,SuperficieRestTest test

  images:
    needs: [secrets, dependencies, filesystem, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build reproduzível sem publicação
        run: |
          docker build --pull --tag jsboy-api:ci backend
          docker build --pull --build-arg VITE_API_URL=https://api.example.invalid --tag jsboy-web:ci frontend
      - name: Exportar metadados de imagem
        run: docker image inspect jsboy-api:ci jsboy-web:ci > image-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: image-metadata.json
          retention-days: 14
